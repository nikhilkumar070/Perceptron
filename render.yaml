services:
  # 1. FastAPI Web Service (Backend)
  - type: web
    name: preceptron-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

  # 2. React/Vite Static Site (Frontend)
  # NOTE: Render's Blueprint spec requires type: web + runtime: static for static sites.
  # Using type: static is a legacy alias that does NOT support the routes field reliably.
  - type: web
    name: preceptron
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback: rewrite all paths to index.html so React Router
      # handles routing on the client. This is a rewrite (not a redirect):
      # the browser URL stays as-is (e.g. /pitch stays /pitch) while
      # Render internally serves dist/index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
